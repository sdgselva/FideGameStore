<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/plantilla :: head}"/>
    <body>
        <!-- fragmento 1 para Agregar producto en ventana modal -->
        <section th:fragment="tabs" class="py-3 mb-4 header-tablas">
            <div class="d-flex justify-content-center px-5"> 
                <ul class="nav nav-underline">
                    <li class="nav-item">
                        <a th:href="@{/}" 
                           th:classappend="${idCategoriaActual == null} ? 'active'"
                           class="nav-link" 
                           aria-current="page">
                            [[#{consultas.todas}]]
                        </a>
                    </li>
                    <li th:each="c : ${categorias}" class="nav-item">
                        <a th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                           th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                           class="nav-link">
                            [[${c.nombreCategoria}]]
                        </a>
                    </li>
                </ul>
            </div>
        </section>

        <!-- Fragmento para el listado de tarjetas de productos -->
        <section th:fragment="tarjetas" class="container py-4">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="a : ${anuncios}" class="col">
                    <div class="card product-card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                        <!-- Imagen del producto -->
                        <div class="d-flex justify-content-center align-items-center bg-light p-3"
                             style="height: 240px;">
                            <img th:src="${a.varianteProducto.producto.rutaImagen}"
                                 th:alt="${a.varianteProducto.producto.nombreProducto}"
                                 class="img-fluid"
                                 style="
                                 max-height: 220px;
                                 max-width: 90%;
                                 object-fit: contain;
                                 transition: transform 0.3s ease;
                                 "
                                 onmouseover="this.style.transform = 'scale(1.08)'"
                                 onmouseout="this.style.transform = 'scale(1)'"/>
                        </div>
                        <!-- Nombre del producto -->
                        <div class="card-header bg-white border-0 pt-3 pb-0">

                            <h5 class="card-title text-center fw-bold text-truncate mb-0"
                                th:text="${a.varianteProducto.producto.nombreProducto}">
                                [[#{anuncio.producto}]]
                            </h5>
                        </div>
                        <!-- Información del producto -->
                        <div class="card-body">
                            <!-- Región y plataforma -->
                            <div class="d-flex justify-content-center gap-2 mb-3 flex-wrap">
                                <!-- Región -->
                                <span class="badge rounded-pill bg-primary px-3 py-2">
                                    <i class="fas fa-globe-americas me-1"></i>

                                    <span th:text="${a.varianteProducto.region.nombreRegion}">
                                        [[#{anuncio.region}]]
                                    </span>
                                </span>
                                <!-- Plataforma -->
                                <span class="badge rounded-pill bg-dark px-3 py-2">
                                    <i class="fas fa-gamepad me-1"></i>

                                    <span th:text="${a.varianteProducto.plataforma.nombrePlataforma}">
                                        [[#{anuncio.platforma}]]
                                    </span>
                                </span>
                            </div>
                            <!-- Precio -->
                            <div class="text-center mt-3">

                                <span class="text-muted small d-block">
                                    [[#{anuncio.precio}]]
                                </span>

                                <span class="fs-3 fw-bold text-success"
                                      th:text="${#numbers.formatCurrency(a.precio)}">
                                    ₡0.00
                                </span>
                            </div>
                        </div>

                        <!-- Footer -->
                        <div class="card-footer bg-white border-0 p-3">

                            <form th:action="@{/carrito/agregar}"
                                  method="POST"
                                  class="d-inline">

                                <input type="hidden"
                                       th:value="${a.idAnuncio}"
                                       name="idAnuncio"/>

                                <button type="button"
                                        class="btn btn-primary rounded-pill fw-bold"
                                        onclick="addCart(this.form, this)">

                                    <i class="fas fa-cart-plus me-2"></i>
                                    Agregar al carrito

                                </button>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
