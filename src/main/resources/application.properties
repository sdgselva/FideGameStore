spring.application.name=fidegamestore
server.port=80

##Arreglo para MultipartFile de TomCat
server.tomcat.max-part-count=100

#Definir formato fecha
logging.pattern.dateformat=hh:mm

#Eliminar mensajes de Spring
spring.main.banner-mode=off

#En desarrollo el "cache" del servidor (false), en producción (true)
spring.thymeleaf.cache=false

#Conexión local a la BD Techshop en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fidegamestore

#Usuario y clave de creaTablas.sql
spring.datasource.username=root
spring.datasource.password=Jolyne.62
 
#Driver y plataforma de comunicación
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
 
#mostrar información en el log
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

